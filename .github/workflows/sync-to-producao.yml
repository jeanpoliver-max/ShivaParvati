name: Auto Merge Main to Producao

on:
  push:
    branches:
      - main  # Dispara toda vez que o AI Studio atualizar a branch main

permissions:
  contents: write

jobs:
  merge-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout local repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Baixa o histórico completo das duas branches

      - name: Configure Git User
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Merge main into producao
        run: |
          git checkout producao
          git merge origin/main --no-edit --strategy-option theirs # Mescla trazendo as novidades sem travar por conflitos simples
          git push origin producao
