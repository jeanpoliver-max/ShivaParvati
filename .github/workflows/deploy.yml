name: Deploy do Painel Shiva Parvati

on:
  push:
    branches:
      - main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20  # Atualizado para evitar avisos de versão antiga

      - name: Instalar Dependências e Compilar
        run: |
          npm install --legacy-peer-deps
          npm run build --if-present  # Executa o build se o script existir

      - name: Upload do Artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: .         # Altera temporariamente para a raiz caso não use pastas de build

      - name: Deploy para GitHub Pages
        uses: actions/deploy-pages@v4
