name: Deploy do Painel Shiva Parvati

on:
  push:
    branches:
      - main  # Executa o deploy sempre que você enviar atualizações para a branch main

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout do Código
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 18
          cache: 'npm'

      - name: Instalar Dependências e Compilar
        run: |
          npm install
          npm run build  # Isso gera a pasta com o painel pronto sem estragar seu código

      - name: Upload do Artefato
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist # Se você usa Vite, altere para './build' se usar React comum

      - name: Deploy para GitHub Pages
        uses: actions/deploy-pages@v4
